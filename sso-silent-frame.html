<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get('project_id');
  const parentOrigin = params.get('parent_origin');

  fetch('/api/central-auth/session-check?project_id=' + encodeURIComponent(projectId), {
    credentials: 'include'
  })
    .then(r => r.json())
    .then(data => window.parent.postMessage(data, parentOrigin))
    .catch(() => window.parent.postMessage({ logueado: false }, parentOrigin));
</script>
</body></html>
